name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  server:
    name: Backend (server) — lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: |
            server/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-server-

      - name: Install (server)
        run: cd server && npm ci --silent || (cd server && npm install --no-audit --no-fund)

      - name: Lint (server)
        run: cd server && npm run lint

      - name: Test (server)
        # Server's test script may enable experimental flags if needed; use npm test to respect package.json
        run: cd server && npm test

  client:
    name: Frontend (client) — lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache client node_modules
        uses: actions/cache@v4
        with:
          path: |
            client/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-client-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-client-

      - name: Install (client)
        run: cd client && npm ci --silent || (cd client && npm install --no-audit --no-fund)

      - name: Lint (client)
        run: cd client && npm run lint

      - name: Test (client)
        run: cd client && npm test
